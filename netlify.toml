[build]
  command = "npm install"
  publish = "."
  functions = "functions"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "DEBUG_ACESSO.md,DEPLOY.md,DEPLOYMENT_AVEN.md,DEPLOY_CHECKLIST.md,DIAGNOSTICO.md,MUDANCAS_REALIZADAS.md,RESUMO_EXECUCAO.txt,TROUBLESHOOTING.md,VERIFICACAO_FINAL.md,comp/index.html,functions/pix-aven.js,test-aven-pix.js,test-direct-gateway.js,test-ecom02.js,test-gateway-correto.js,test-shopify-loja03.js"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "/assets/webfonts/*.woff2"
  [headers.values]
    Content-Type = "font/woff2"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/webfonts/*.woff"
  [headers.values]
    Content-Type = "font/woff"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/webfonts/*.ttf"
  [headers.values]
    Content-Type = "font/ttf"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/webfonts/*.eot"
  [headers.values]
    Content-Type = "application/vnd.ms-fontobject"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

[[redirects]]
  from = "/api/pix"
  to = "/.netlify/functions/pix"
  status = 200

[[redirects]]
  from = "/api/check-payment"
  to = "/.netlify/functions/check-payment"
  status = 200

[[redirects]]
  from = "/api/notify-approved"
  to = "/.netlify/functions/notify-approved"
  status = 200

[[redirects]]
  from = "/api/comprovantes/upload.php"
  to = "/.netlify/functions/comprovantes-upload"
  status = 200

[[redirects]]
  from = "/api/comprovantes-upload"
  to = "/.netlify/functions/comprovantes-upload"
  status = 200

[[redirects]]
  from = "/api/log-access"
  to = "/.netlify/functions/log-access"
  status = 200

[[redirects]]
  from = "/api/consulta.php"
  to = "/.netlify/functions/consulta"
  status = 200

[[redirects]]
  from = "/api/webhook/paradise"
  to = "/.netlify/functions/webhook-paradise"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
